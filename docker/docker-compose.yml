services:
  web:
    build:
      context: ..
      dockerfile: docker/django/Dockerfile
    container_name: web
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - shared_net
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  nginx:
    build:
      context: ./nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - web
    environment:
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    networks:
      - shared_net
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro

networks:
  shared_net:
    external: true

volumes:
  static_files:
  media_files:
